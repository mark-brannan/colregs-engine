name: Claude PR Review

# An independent reviewer for every pull request -- advisory, and gated on the
# pull request's content fingerprint so a Mergify update that changes nothing
# costs nothing. The reviewer itself is shared: mark-brannan/.github holds the
# workflow, the gate and the argument for both; this file is only the trigger
# and this repository's brief for it.
#
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret (mint one with `claude setup-token`,
# then `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R mark-brannan/colregs-engine`).
# Until it exists the review skips with a warning rather than failing every
# pull request.
#
# Fork pull requests are excluded (the shared workflow skips them): a fork
# can't read this repo's secret, so a review there would only fail red for
# no reason. There's no separate least-privilege path for fork diffs today.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# The called workflow asks for exactly these; a caller may grant no less.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # Pinned to a reviewed commit rather than @main -- flagged by CodeRabbit
    # (2026-09-05) with zizmor's unpinned-uses backing it: @main lets a
    # future push to mark-brannan/.github change what runs here, with
    # CLAUDE_CODE_OAUTH_TOKEN/pull-requests:write/id-token:write, and no
    # corresponding commit in this repo. Bump deliberately when the shared
    # workflow changes.
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@bdaa39fa178205a1657cb30e590637df4c73c72e
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      prompt: |
        Review this pull request to a public research repo: an applicability
        evaluator over the colregs data package (predicates over a fact
        record -> applicable entries -> relations resolved -> lawful
        displays). As of this review the repo is still docs-only ("name
        staked, not yet started" in README.md) -- the engine itself is being
        built in mark-brannan/searoom first. Expect most PRs here to be docs,
        the formal-methods reading list/glossary, or scaffolding, not
        application code.

        Hard constraints:
          - no credential, token, key, or password-looking string anywhere in
            the diff, including in docs and examples.
          - a claim about COLREGS rule text or the upstream colregs package's
            schema should be checked against that package, not asserted from
            memory.
          - once source code exists here, verify by running it (npm ci/test/
            build or the equivalent) rather than hand-tracing; say what you
            ran.

        Otherwise review for correctness and clear simplification
        opportunities; skip pure style nits. Post inline comments on specific
        lines, then a short top-level summary. If you find nothing, say so
        briefly instead of inventing findings.
      allowed-tools: mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
      timeout-minutes: 15
