name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The data types in src/generated/ are compiled from colregs' JSON
      # Schema and checked in. If the pinned schema and the checked-in types
      # disagree, the engine is typed against a shape the data no longer has:
      # fail here rather than let a consumer discover it.
      - run: npm run generate:check
      - run: npm run typecheck
      # No prose-budget engine on this runner; the prose-budget job below
      # is the gate for docs/budgets.json, so the local wrapper skips here.
      - uses: mark-brannan/.github/.github/actions/npm-test-prose-fallback@main
      # tsconfig.build.json (declaration emit, src-only) is otherwise never
      # exercised: a declaration-emit-only error, or a bad import specifier in
      # the emitted ESM, would pass typecheck and tests and break consumers.
      - run: npm run build

  # The exhaustive conformance harness (research/conformance/): every record
  # in the partitioned fact space, engine against an independent reference
  # reading of the predicate semantics. Runtime is linear in the record
  # count and the count is a product over fact axes, so one job outgrows any
  # timeout the moment colregs adds an axis. Each matrix leg walks one
  # residue class of the space (`--shard=i/N`, split again over the runner's
  # cores) and uploads a tally; `conformance-register` below reduces them.
  # Adding legs to the matrix is the whole knob: `strategy.job-total` is N.
  # A leg exits non-zero only on a conformance mismatch in its slice; data
  # findings are printed, not failed.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run conformance -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --out=tally-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: conformance-tally-${{ matrix.shard }}
          path: tally-${{ matrix.shard }}.json
          retention-days: 1

  # Merges the shard tallies: coverage, traceability, fixture replay and the
  # findings register are only sound over the whole space, so they live
  # here and not in a leg. Fails on a register this run would rewrite;
  # the diff step catches anything else the harness touched.
  conformance-register:
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-tally-*
          path: tallies
          merge-multiple: true
      - run: npm run conformance -- --merge tallies/*.json
      - run: git diff --exit-code -- research/conformance/findings

  # Ladder step 4 (research/rocq/): the partition-soundness lemma the
  # conformance job's representatives rest on, compiled by the distribution's
  # Coq/Rocq -- the proof is a single stdlib-only file, so the apt package is
  # lighter than an opam switch or the rocq-prover image. Fails on a compile
  # or proof error, or on the generic theorem acquiring an assumption; the
  # stdlib deprecation warnings a newer Rocq prints do not fail it.
  partition-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coq
      - run: coqc research/rocq/Partition.v > partition.out
      - run: cat partition.out && grep -q "Closed under the global context" partition.out

  # Prose budgets (docs/budgets.json) through the shared prose-budget engine
  # in mark-brannan/dotfiles; test/docs.test.ts runs the same engine locally.
  prose-budget:
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main

  # Refuses to call an empty PR green: a branch whose tree equals its base at
  # the merge base (a stray commit reverted it) merges cleanly and lands
  # nothing. Listed in ci-gate's needs, so it needs no ruleset entry.
  nonempty:
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # The single required status check, shared across repositories: the
  # `gate` job of mark-brannan/.github's reusable ci-gate workflow, which fails
  # unless every result in `needs` is green. The reported context is
  # "ci-gate / gate" -- GitHub names a reusable workflow's checks
  # "<caller job> / <called job>" -- and that is what the ruleset requires, so
  # this job's id is part of the contract. `always()` is what lets the gate
  # evaluate when a dependency failed or was skipped, so it reports an explicit
  # pass or fail of its own rather than inheriting the skip.
  ci-gate:
    needs: [test, conformance, conformance-register, partition-proof, prose-budget, nonempty]
    if: always()
    # It reads nothing and writes nothing; the results go in as an input.
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
